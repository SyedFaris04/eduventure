# EDUVENTURE room server: one Durable Object per island room (up to 12 visible players).
# Dev: npm run dev (no account needed). Deploy: npm run deploy (needs CLOUDFLARE_API_TOKEN).
name = "eduventure-rooms"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

# Public values only (the same ones the web app ships). The room server holds no Supabase secret.
[vars]
SUPABASE_URL = "https://itythivrujbfcucbxbxa.supabase.co"
