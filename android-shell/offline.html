<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eduventure</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: system-ui, sans-serif; background: linear-gradient(#8ed1ff, #c9ecff 60%, #6cc24a); color: #5a3d30; text-align: center; }
      main { max-width: 360px; background: #fff4dc; border: 4px solid #8b5e3c; border-radius: 24px; padding: 24px; }
      h1 { margin: 0 0 8px; font-size: 1.6rem; }
      p { margin: 0 0 16px; }
      button { min-height: 48px; padding: 0 28px; border-radius: 16px; border: 3px solid #3f8f2a; background: #6cc24a; color: #fff; font-size: 1.1rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <!-- The game hides the splash screen once it shows; when it could not load, this page does. -->
    <script>window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide()</script>
    <main>
      <h1>You're offline</h1>
      <p>Eduventure needs the internet to load your adventure.<br /><span lang="ms">Eduventure memerlukan internet. Sila sambung semula.</span></p>
      <button type="button" onclick="location.replace('https://syedfaris04.github.io/eduventure/play/')">Try again · Cuba lagi</button>
    </main>
  </body>
</html>
